#
# Use this docker-compose file to run URSim in a Docker container.
# Make sure to create the 'dockernet' network beforehand with the following command:
# docker network create -d bridge --subnet 192.168.0.0/24 --gateway 192.168.0.1 dockernet
#
# Check host IP address in the 'dockernet' network using:
# docker network inspect dockernet
# or
# route | awk '/^default/ { print $2 }'
name: palletization-dual-UR10e
services:
  Robot_1_UR10e:
    container_name: robot_1_ur10e
    image: universalrobots/ursim_e-series:latest
    networks:
      - dockernet
    ports:
      - 5901:5900 # VNC port: 5900
      - 6081:6080 # Web browser VNC port: 6080
      - 29991:29999 # Dashboard port: 29999
      - 30011-30014:30001-30004 # Real-time client ports: 30001-30004
    stdin_open: true
    tty: true
    environment:
      - ROBOT_MODEL=UR10
    volumes:
      - ./ursim/programs_1:/ursim/programs
  
  Robot_2_UR10e:
    container_name: robot_2_ur10e
    image: universalrobots/ursim_e-series:latest
    networks:
      - dockernet
    ports:
      - 5902:5900 # VNC port: 5900
      - 6082:6080 # Web browser VNC port: 6080
      - 29992:29999 # Dashboard port: 29999
      - 30021-30024:30001-30004 # Real-time client ports: 30001-30004
    stdin_open: true
    tty: true
    environment:
      - ROBOT_MODEL=UR10
    volumes:
      - ./ursim/programs_2:/ursim/programs

networks:
  dockernet:
    external: true