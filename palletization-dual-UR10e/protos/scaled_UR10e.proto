# keywords: robot/arm
# An Universal Robots UR10e robotic arm, uniformly scaled by the `scale` field.
# Lengths are multiplied by `scale`, masses by `scale^3` and maximum torques by `scale^4`,
# so the scaled robot keeps the same density and the same gravity-load margin as the original.
# More information here: [URe](https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/robots/universal_robots/protos/UR3e.proto)
# template language: javascript

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/appearances/protos/OldSteel.proto"
EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/appearances/protos/ScrewThread.proto"

PROTO scaled_UR10e [
  field SFVec3f    translation     0 0 0        # Is `Pose.translation`.
  field SFRotation rotation        0 0 1 0      # Is `Pose.rotation`.
  field SFString   name            "UR10e"      # Is `Solid.name`.
  field SFFloat    scale           1.5          # Defines the uniform scale factor of the robot, it must be strictly positive.
  field SFString   controller      "<generic>"  # Is `Robot.controller`.
  field MFString   controllerArgs  []           # Is `Robot.controllerArgs`.
  field SFString   window          "<generic>"  # Is `Robot.window`.
  field SFBool     supervisor      FALSE        # Is `Robot.supervisor`.
  field SFBool     synchronization TRUE         # Is `Robot.synchronization`.
  field SFBool     selfCollision   TRUE         # Is `Robot.selfCollision`.
  field MFNode     toolSlot        []           # Extend the robot with new nodes at the end of the arm (the tool itself is not scaled, only its mounting position).
  field SFBool     staticBase      TRUE         # Defines if the robot base should be pinned to the static environment.
]
{
  %<
  let name = fields.name.value;

  let s = fields.scale.value;
  if (s <= 0.0) {
    console.error('\'scale\' must be strictly positive, value reset to ' + fields.scale.defaultValue + '.');
    s = fields.scale.defaultValue;
  }
  const s3 = s * s * s;  // masses scale with the volume
  const s4 = s3 * s;     // gravity torques scale with mass times lever arm

  function r(x) {
    return parseFloat(x.toFixed(6));
  }
  function L(x) {  // length
    return r(x * s);
  }
  function M(x) {  // mass
    return r(x * s3);
  }
  function T(x) {  // torque
    return r(x * s4);
  }
