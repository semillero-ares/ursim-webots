  Robot {
    translation IS translation
    rotation IS rotation
    children [
      Pose {
        translation %<= L(-0.0602) >% %<= L(0.0601) >% %<= L(0.0252) >%
        rotation 1 0 0 -3.1415923071795864
        children [
          DEF SCREW Group {
            children [
              Transform {
                scale %<= r(1.1 * s) >% %<= r(1.1 * s) >% %<= r(1.1 * s) >%
                children [
                  Shape {
                    appearance OldSteel {
                    }
                    geometry Mesh {
                      url "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/universal_robots/protos/UR10e/meshes/screw.obj"
                    }
                  }
                ]
              }
              DEF CYLINDER Pose {
                translation 0 0 %<= L(0.02) >%
                rotation -0.707107 0.707107 0 -3.141593
                children [
                  Shape {
                    appearance ScrewThread {
                      textureTransform TextureTransform {
                        rotation 1.5708
                        scale 1.6 2
                      }
                    }
                    geometry Cylinder {
                      height %<= L(0.04) >%
                      radius %<= L(0.0044) >%
                    }
                  }
                ]
              }
            ]
          }
        ]
      }
      Pose {
        translation %<= L(-0.0602) >% %<= L(-0.0602) >% %<= L(0.0252) >%
        rotation 1 0 0 -3.1415923071795864
        children [
